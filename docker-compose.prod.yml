name: first-solo-prod

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fs_prod_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fs_prod_backend
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: "false" # set to "true" once the site is served over HTTPS
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: fs_prod_web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata_prod: